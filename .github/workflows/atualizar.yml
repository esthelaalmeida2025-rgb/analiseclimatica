name: Atualizar painel INMET-SP e MG

on:
  schedule:
    - cron: '0 9 * * 1'      # toda segunda-feira, 06h (Brasília)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python atualizar.py
      - name: Publicar
        run: |
          git config user.name  "painel-bot"
          git config user.email "painel-bot@users.noreply.github.com"
          git add mensal_*.json docs
          git diff --cached --quiet || git commit -m "Atualização automática $(date +%d/%m/%Y)"
          git push
